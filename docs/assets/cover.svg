<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="460" viewBox="0 0 1440 460" role="img" aria-labelledby="title description">
  <title id="title">Herdr × Omarchy</title>
  <desc id="description">Your desktop shortcuts, inside your terminal. Super Space opens the menu, Super A opens an agent, and Super Right moves through panes and tabs.</desc>
